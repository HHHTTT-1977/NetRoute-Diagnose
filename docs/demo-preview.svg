<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">NetRoute-Diagnose demo report preview</title>
  <desc id="desc">A synthetic offline report showing ten passing route checks and no mismatches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="48" y="38" width="1104" height="599" rx="18" fill="#fff" stroke="#dbe3ef" filter="url(#shadow)"/>

  <text x="84" y="90" fill="#172033" font-family="system-ui, sans-serif" font-size="30" font-weight="700">NetRoute-Diagnose</text>
  <text x="84" y="119" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">Synthetic offline demo · Static rule analysis only · No personal network data</text>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(84 150)">
      <rect width="235" height="88" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
      <text x="18" y="40" fill="#16a34a" font-size="30" font-weight="700">10</text>
      <text x="18" y="66" fill="#64748b" font-size="13">PASS</text>
    </g>
    <g transform="translate(336 150)">
      <rect width="235" height="88" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
      <text x="18" y="40" fill="#dc2626" font-size="30" font-weight="700">0</text>
      <text x="18" y="66" fill="#64748b" font-size="13">MISMATCH</text>
    </g>
    <g transform="translate(588 150)">
      <rect width="235" height="88" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
      <text x="18" y="40" fill="#d97706" font-size="30" font-weight="700">0</text>
      <text x="18" y="66" fill="#64748b" font-size="13">UNCERTAIN</text>
    </g>
    <g transform="translate(840 150)">
      <rect width="228" height="88" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
      <text x="18" y="40" fill="#64748b" font-size="30" font-weight="700">0</text>
      <text x="18" y="66" fill="#64748b" font-size="13">UNKNOWN</text>
    </g>

    <text x="84" y="284" fill="#172033" font-size="19" font-weight="700">Rule path checks / 规则路径检查</text>
    <rect x="84" y="303" width="984" height="282" rx="10" fill="#fff" stroke="#dbe3ef"/>
    <rect x="84" y="303" width="984" height="44" rx="10" fill="#f8fafc"/>
    <g fill="#64748b" font-size="12" font-weight="600">
      <text x="104" y="330">APP</text>
      <text x="230" y="330">DOMAIN</text>
      <text x="500" y="330">EXPECTED</text>
      <text x="620" y="330">ACTUAL</text>
      <text x="730" y="330">STATUS</text>
      <text x="850" y="330">MATCHED RULE</text>
    </g>

    <g font-size="13">
      <g transform="translate(0 0)">
        <text x="104" y="380" fill="#172033">WeChat</text>
        <text x="230" y="380" fill="#2563eb">weixin.qq.com</text>
        <text x="500" y="380" fill="#172033">DIRECT</text>
        <text x="620" y="380" fill="#172033">DIRECT</text>
        <rect x="730" y="362" width="62" height="24" rx="12" fill="#dcfce7"/>
        <text x="746" y="379" fill="#15803d" font-size="11" font-weight="700">PASS</text>
        <text x="850" y="380" fill="#475569">DOMAIN-SUFFIX,…,DIRECT</text>
      </g>
      <line x1="104" y1="403" x2="1048" y2="403" stroke="#e2e8f0"/>
      <g>
        <text x="104" y="432" fill="#172033">Apple</text>
        <text x="230" y="432" fill="#2563eb">api.smoot.apple.cn</text>
        <text x="500" y="432" fill="#172033">DIRECT</text>
        <text x="620" y="432" fill="#172033">DIRECT</text>
        <rect x="730" y="414" width="62" height="24" rx="12" fill="#dcfce7"/>
        <text x="746" y="431" fill="#15803d" font-size="11" font-weight="700">PASS</text>
        <text x="850" y="432" fill="#475569">DOMAIN,…,DIRECT</text>
      </g>
      <line x1="104" y1="455" x2="1048" y2="455" stroke="#e2e8f0"/>
      <g>
        <text x="104" y="484" fill="#172033">Google</text>
        <text x="230" y="484" fill="#2563eb">google.com</text>
        <text x="500" y="484" fill="#172033">PROXY</text>
        <text x="620" y="484" fill="#172033">PROXY</text>
        <rect x="730" y="466" width="62" height="24" rx="12" fill="#dcfce7"/>
        <text x="746" y="483" fill="#15803d" font-size="11" font-weight="700">PASS</text>
        <text x="850" y="484" fill="#475569">DOMAIN-SUFFIX,…,PROXY</text>
      </g>
      <line x1="104" y1="507" x2="1048" y2="507" stroke="#e2e8f0"/>
      <g>
        <text x="104" y="536" fill="#172033">OpenAI</text>
        <text x="230" y="536" fill="#2563eb">api.openai.com</text>
        <text x="500" y="536" fill="#172033">PROXY</text>
        <text x="620" y="536" fill="#172033">PROXY</text>
        <rect x="730" y="518" width="62" height="24" rx="12" fill="#dcfce7"/>
        <text x="746" y="535" fill="#15803d" font-size="11" font-weight="700">PASS</text>
        <text x="850" y="536" fill="#475569">DOMAIN,…,PROXY</text>
      </g>
    </g>
  </g>

  <text x="84" y="616" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Generated from examples only. DNS and egress requests are skipped in offline mode.</text>
</svg>
