name: Bug report
description: Report a reproducible problem without sharing network secrets.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include subscription URLs, proxy endpoints, tokens, credentials,
        real public or private IP addresses, MAC addresses, personal paths, or
        unredacted Clash/OpenClash configurations.
  - type: input
    id: version
    attributes:
      label: NetRoute-Diagnose version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Clash/OpenClash/Mihomo version (optional)
      placeholder: "Mihomo version"
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal sanitized reproduction
      description: Use synthetic domains and redacted rule names where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed configuration secrets, addresses, paths, and credentials.
          required: true
