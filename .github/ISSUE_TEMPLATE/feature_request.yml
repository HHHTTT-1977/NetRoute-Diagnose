name: Feature request
description: Suggest a user-focused improvement without sharing private configuration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, without personal network details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Optional sanitized context
      description: Never include subscription URLs, proxy endpoints, credentials, addresses, or unredacted configs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private configuration, credentials, or network identifiers.
          required: true
